<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Calendar Outline -->
  <rect x="11" y="16" width="42" height="36" rx="7" stroke="url(#gridGrad)" stroke-width="2.5" fill="rgba(15, 23, 42, 0.6)"/>

  <!-- Top Rings -->
  <rect x="18" y="12" width="3.5" height="7" rx="1.75" fill="#38bdf8"/>
  <rect x="42.5" y="12" width="3.5" height="7" rx="1.75" fill="#38bdf8"/>

  <!-- Timetable Grid Slots -->
  <!-- Row 1 -->
  <rect x="15.5" y="22" width="7" height="6" rx="2" fill="#38bdf8"/>
  <rect x="24.5" y="22" width="7" height="6" rx="2" fill="#f43f5e"/>
  <rect x="33.5" y="22" width="6" height="6" rx="2" fill="#fbbf24"/>
  <rect x="41.5" y="22" width="7.5" height="6" rx="2" fill="#d946ef"/>

  <!-- Row 2 -->
  <rect x="15.5" y="30.5" width="7" height="11" rx="2" fill="#10b981"/>
  <rect x="24.5" y="30.5" width="15" height="5" rx="2" fill="#6366f1"/>
  <rect x="41.5" y="30.5" width="7.5" height="11" rx="2" fill="#fb923c"/>

  <!-- Row 3 -->
  <rect x="24.5" y="37.5" width="7" height="9" rx="2" fill="#ec4899"/>
  <rect x="33.5" y="37.5" width="6" height="9" rx="2" fill="#06b6d4"/>

  <!-- Golden Optimization Spark Star in Top Center -->
  <g transform="translate(32, 16) scale(0.9)">
    <polygon points="0,-10 2.5,-3 9.5,-3 4,1.5 6,8.5 0,4.5 -6,8.5 -4,1.5 -9.5,-3 -2.5,-3" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
</svg>